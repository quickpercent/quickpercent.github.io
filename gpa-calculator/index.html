<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPA Calculator – Calculate Your High School & College GPA Online</title>
<meta name="description" content="Free online GPA Calculator to easily calculate your high school, college, or university GPA. Convert letter grades and credit hours into accurate GPA results.">
<meta name="keywords" content="GPA Calculator, College GPA Calculator, High School GPA Calculator, Cumulative GPA, Grade Point Average">

<meta name="robots" content="index, follow">
<meta name="author" content="Easy Grader">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://quickpercent.github.io/gpa-calculator/">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter', sans-serif;background:#f8fafc;color:#1e293b;display:flex;flex-direction:column;min-height:100vh;}
header{background:#ffffff;border-bottom:1px solid #e2e8f0;padding:14px 24px;position:sticky;top:0;z-index:100;}
.header-container{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
.brand-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand-icon{width:38px;height:38px;background:linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.brand-name{font-size:22px;font-weight:800;color:#0f172a;}
.brand-name span{color:#2563eb;}
nav{display:flex;gap:24px;}
nav a{color:#475569;text-decoration:none;font-weight:600;font-size:14px;}
nav a:hover, nav a.active{color:#2563eb;}

.container{max-width:900px;margin:40px auto;padding:0 20px;flex:1;}
.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:28px;border:1px solid #e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,0.03);}
.title{font-size:24px;font-weight:800;color:#0f172a;margin-bottom:20px;}

.course-row{display:grid;grid-template-columns:2fr 1fr 1fr 40px;gap:12px;margin-bottom:12px;align-items:center;}
input, select{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;outline:none;}
.btn-remove{background:#fee2e2;color:#dc2626;border:0;border-radius:8px;height:42px;font-weight:bold;cursor:pointer;}
.btn-add{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px;}

.calc-btn{width:100%;background:#2563eb;color:#fff;border:0;padding:15px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;}
.result-box{margin-top:20px;background:#f8fafc;border:1px solid #e2e8f0;padding:20px;border-radius:12px;text-align:center;}
.result-score{font-size:36px;font-weight:800;color:#2563eb;margin-top:5px;}

footer{background:#0f172a;color:#94a3b8;padding:40px 20px;margin-top:auto;}
.footer-container{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
.footer-container a{color:#94a3b8;text-decoration:none;margin-left:15px;}

@media(max-width:600px){
  .course-row{grid-template-columns:1fr 1fr;gap:8px;}
  .course-row input:first-child{grid-column:span 2;}
  nav{display:none;}
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <a href="https://quickpercent.github.io/" class="brand-logo">
      <div class="brand-icon">EG</div>
      <div class="brand-name">Easy<span>Grader</span></div>
    </a>
    <nav>
      <a href="https://quickpercent.github.io/">Easy Grader</a>
      <a href="https://quickpercent.github.io/gpa-calculator/" class="active">GPA Calculator</a>
      <a href="https://quickpercent.github.io/cgpa-calculator/">CGPA Calculator</a>
      <a href="https://quickpercent.github.io/attendance-calculator/">Attendance Calculator</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="title">GPA Calculator</div>
    <div id="courseContainer">
      <div class="course-row">
        <input type="text" placeholder="Course Name (Optional)">
        <select class="grade">
          <option value="4.0">A (4.0)</option>
          <option value="3.7">A- (3.7)</option>
          <option value="3.3">B+ (3.3)</option>
          <option value="3.0">B (3.0)</option>
          <option value="2.7">B- (2.7)</option>
          <option value="2.3">C+ (2.3)</option>
          <option value="2.0">C (2.0)</option>
          <option value="1.7">C- (1.7)</option>
          <option value="1.0">D (1.0)</option>
          <option value="0.0">F (0.0)</option>
        </select>
        <input type="number" class="credits" placeholder="Credits" value="3" min="1">
        <button class="btn-remove" onclick="removeRow(this)">X</button>
      </div>
    </div>

    <button class="btn-add" onclick="addRow()">+ Add Course</button>
    <button class="calc-btn" onclick="calculateGPA()">Calculate GPA</button>

    <div class="result-box">
      <div style="font-size:14px; font-weight:600; color:#64748b;">YOUR GPA</div>
      <div class="result-score" id="gpaScore">0.00</div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-container">
    <p>&copy; 2026 Easy Grader. All rights reserved.</p>
    <div>
      <a href="https://quickpercent.github.io/">Easy Grader</a>
      <a href="https://quickpercent.github.io/gpa-calculator/">GPA Calculator</a>
    </div>
  </div>
</footer>

<script>
function addRow(){
  const div = document.createElement("div");
  div.className = "course-row";
  div.innerHTML = `
    <input type="text" placeholder="Course Name (Optional)">
    <select class="grade">
      <option value="4.0">A (4.0)</option>
      <option value="3.7">A- (3.7)</option>
      <option value="3.3">B+ (3.3)</option>
      <option value="3.0">B (3.0)</option>
      <option value="2.7">B- (2.7)</option>
      <option value="2.3">C+ (2.3)</option>
      <option value="2.0">C (2.0)</option>
      <option value="1.7">C- (1.7)</option>
      <option value="1.0">D (1.0)</option>
      <option value="0.0">F (0.0)</option>
    </select>
    <input type="number" class="credits" placeholder="Credits" value="3" min="1">
    <button class="btn-remove" onclick="removeRow(this)">X</button>
  `;
  document.getElementById("courseContainer").appendChild(div);
}

function removeRow(btn){
  const rows = document.querySelectorAll(".course-row");
  if(rows.length > 1){
    btn.parentElement.remove();
    calculateGPA();
  }
}

function calculateGPA(){
  const grades = document.querySelectorAll(".grade");
  const credits = document.querySelectorAll(".credits");
  let totalPoints = 0;
  let totalCredits = 0;

  for(let i=0; i<grades.length; i++){
    let g = parseFloat(grades[i].value);
    let c = parseFloat(credits[i].value);
    if(!isNaN(c) && c > 0){
      totalPoints += g * c;
      totalCredits += c;
    }
  }

  let gpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : "0.00";
  document.getElementById("gpaScore").textContent = gpa;
}
</script>
</body>
</html>
