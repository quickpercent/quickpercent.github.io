<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGPA Calculator – Calculate Cumulative GPA Online</title>
<meta name="description" content="Free online CGPA Calculator to easily calculate your cumulative grade point average across all semesters for university or college.">
<meta name="keywords" content="CGPA Calculator, Cumulative GPA Calculator, Semester CGPA, Calculate CGPA Online">

<meta name="robots" content="index, follow">
<meta name="author" content="Easy Grader">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://quickpercent.github.io/cgpa-calculator/">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter', sans-serif;background:#f8fafc;color:#1e293b;display:flex;flex-direction:column;min-height:100vh;}
header{background:#ffffff;border-bottom:1px solid #e2e8f0;padding:14px 24px;position:sticky;top:0;z-index:100;}
.header-container{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
.brand-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand-icon{width:38px;height:38px;background:linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.brand-name{font-size:22px;font-weight:800;color:#0f172a;}
.brand-name span{color:#2563eb;}
nav{display:flex;gap:24px;}
nav a{color:#475569;text-decoration:none;font-weight:600;font-size:14px;}
nav a:hover, nav a.active{color:#2563eb;}

.container{max-width:900px;margin:40px auto;padding:0 20px;flex:1;}
.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:28px;border:1px solid #e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,0.03);}
.title{font-size:24px;font-weight:800;color:#0f172a;margin-bottom:20px;}

.sem-row{display:grid;grid-template-columns:2fr 1fr 1fr 40px;gap:12px;margin-bottom:12px;align-items:center;}
input{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;outline:none;}
.btn-remove{background:#fee2e2;color:#dc2626;border:0;border-radius:8px;height:42px;font-weight:bold;cursor:pointer;}
.btn-add{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px;}

.calc-btn{width:100%;background:#2563eb;color:#fff;border:0;padding:15px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;}
.result-box{margin-top:20px;background:#f8fafc;border:1px solid #e2e8f0;padding:20px;border-radius:12px;text-align:center;}
.result-score{font-size:36px;font-weight:800;color:#2563eb;margin-top:5px;}

footer{background:#0f172a;color:#94a3b8;padding:40px 20px;margin-top:auto;}
.footer-container{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
.footer-container a{color:#94a3b8;text-decoration:none;margin-left:15px;}

@media(max-width:600px){
  .sem-row{grid-template-columns:1fr 1fr;gap:8px;}
  .sem-row input:first-child{grid-column:span 2;}
  nav{display:none;}
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <a href="https://quickpercent.github.io/" class="brand-logo">
      <div class="brand-icon">EG</div>
      <div class="brand-name">Easy<span>Grader</span></div>
    </a>
    <nav>
      <a href="https://quickpercent.github.io/">Easy Grader</a>
      <a href="https://quickpercent.github.io/gpa-calculator/">GPA Calculator</a>
      <a href="https://quickpercent.github.io/cgpa-calculator/" class="active">CGPA Calculator</a>
      <a href="https://quickpercent.github.io/attendance-calculator/">Attendance Calculator</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="title">CGPA Calculator (Cumulative GPA)</div>
    <div id="semContainer">
      <div class="sem-row">
        <input type="text" placeholder="Semester Name (e.g. Semester 1)" value="Semester 1">
        <input type="number" class="gpa" placeholder="GPA (e.g. 3.5)" step="0.01" min="0" max="4.0">
        <input type="number" class="credits" placeholder="Total Credits" value="15" min="1">
        <button class="btn-remove" onclick="removeRow(this)">X</button>
      </div>
      <div class="sem-row">
        <input type="text" placeholder="Semester Name (e.g. Semester 2)" value="Semester 2">
        <input type="number" class="gpa" placeholder="GPA (e.g. 3.2)" step="0.01" min="0" max="4.0">
        <input type="number" class="credits" placeholder="Total Credits" value="15" min="1">
        <button class="btn-remove" onclick="removeRow(this)">X</button>
      </div>
    </div>

    <button class="btn-add" onclick="addRow()">+ Add Semester</button>
    <button class="calc-btn" onclick="calculateCGPA()">Calculate CGPA</button>

    <div class="result-box">
      <div style="font-size:14px; font-weight:600; color:#64748b;">YOUR CUMULATIVE CGPA</div>
      <div class="result-score" id="cgpaScore">0.00</div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-container">
    <p>&copy; 2026 Easy Grader. All rights reserved.</p>
    <div>
      <a href="https://quickpercent.github.io/">Easy Grader</a>
      <a href="https://quickpercent.github.io/cgpa-calculator/">CGPA Calculator</a>
    </div>
  </div>
</footer>

<script>
let semCount = 2;

function addRow(){
  semCount++;
  const div = document.createElement("div");
  div.className = "sem-row";
  div.innerHTML = `
    <input type="text" placeholder="Semester Name" value="Semester ${semCount}">
    <input type="number" class="gpa" placeholder="GPA" step="0.01" min="0" max="4.0">
    <input type="number" class="credits" placeholder="Total Credits" value="15" min="1">
    <button class="btn-remove" onclick="removeRow(this)">X</button>
  `;
  document.getElementById("semContainer").appendChild(div);
}

function removeRow(btn){
  const rows = document.querySelectorAll(".sem-row");
  if(rows.length > 1){
    btn.parentElement.remove();
    calculateCGPA();
  }
}

function calculateCGPA(){
  const gpas = document.querySelectorAll(".gpa");
  const credits = document.querySelectorAll(".credits");
  let totalPoints = 0;
  let totalCredits = 0;

  for(let i=0; i<gpas.length; i++){
    let g = parseFloat(gpas[i].value);
    let c = parseFloat(credits[i].value);
    if(!isNaN(g) && !isNaN(c) && c > 0){
      totalPoints += g * c;
      totalCredits += c;
    }
  }

  let cgpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : "0.00";
  document.getElementById("cgpaScore").textContent = cgpa;
}
</script>
</body>
</html>
