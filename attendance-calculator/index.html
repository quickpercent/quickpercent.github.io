<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Calculator – Calculate Class Attendance Percentage Online</title>
<meta name="description" content="Free online Attendance Calculator. Calculate your attendance percentage, how many classes you can miss, or how many classes you need to attend to reach your target attendance.">
<meta name="keywords" content="Attendance Calculator, Class Attendance Calculator, College Attendance Calculator, Safe Bunk Calculator">

<meta name="robots" content="index, follow">
<meta name="author" content="Easy Grader">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://quickpercent.github.io/attendance-calculator/">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter', sans-serif;background:#f8fafc;color:#1e293b;display:flex;flex-direction:column;min-height:100vh;}
header{background:#ffffff;border-bottom:1px solid #e2e8f0;padding:14px 24px;position:sticky;top:0;z-index:100;}
.header-container{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
.brand-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand-icon{width:38px;height:38px;background:linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.brand-name{font-size:22px;font-weight:800;color:#0f172a;}
.brand-name span{color:#2563eb;}
nav{display:flex;gap:24px;}
nav a{color:#475569;text-decoration:none;font-weight:600;font-size:14px;}
nav a:hover, nav a.active{color:#2563eb;}

.container{max-width:800px;margin:40px auto;padding:0 20px;flex:1;}
.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:28px;border:1px solid #e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,0.03);}
.title{font-size:24px;font-weight:800;color:#0f172a;margin-bottom:20px;}

.field{display:flex;flex-direction:column;margin-bottom:16px;}
.field label{font-weight:700;margin-bottom:8px;color:#334155;font-size:14px;}
input{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;outline:none;}
input:focus{border-color:#2563eb;}

.calc-btn{width:100%;background:#2563eb;color:#fff;border:0;padding:15px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;}
.result-box{margin-top:24px;background:#f8fafc;border:1px solid #e2e8f0;padding:20px;border-radius:12px;text-align:center;}
.result-score{font-size:36px;font-weight:800;color:#2563eb;margin-top:5px;}
.result-status{margin-top:10px;font-size:15px;font-weight:600;color:#475569;}

footer{background:#0f172a;color:#94a3b8;padding:40px 20px;margin-top:auto;}
.footer-container{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
.footer-container a{color:#94a3b8;text-decoration:none;margin-left:15px;}

@media(max-width:600px){
  nav{display:none;}
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <a href="https://quickpercent.github.io/" class="brand-logo">
      <div class="brand-icon">EG</div>
      <div class="brand-name">Easy<span>Grader</span></div>
    </a>
    <nav>
      <a href="https://quickpercent.github.io/">Easy Grader</a>
      <a href="https://quickpercent.github.io/gpa-calculator/">GPA Calculator</a>
      <a href="https://quickpercent.github.io/cgpa-calculator/">CGPA Calculator</a>
      <a href="https://quickpercent.github.io/attendance-calculator/" class="active">Attendance Calculator</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="title">Class Attendance Calculator</div>

    <div class="field">
      <label for="presentClasses">Classes Attended (Present)</label>
      <input type="number" id="presentClasses" placeholder="e.g. 45" min="0">
    </div>

    <div class="field">
      <label for="totalClasses">Total Classes Held So Far</label>
      <input type="number" id="totalClasses" placeholder="e.g. 50" min="1">
    </div>

    <div class="field">
      <label for="targetPercent">Required Attendance Goal (%)</label>
      <input type="number" id="targetPercent" value="75" min="1" max="100">
    </div>

    <button class="calc-btn" onclick="calculateAttendance()">Calculate Attendance</button>

    <div class="result-box">
      <div style="font-size:14px; font-weight:600; color:#64748b;">CURRENT ATTENDANCE</div>
      <div class="result-score" id="attendancePercent">0%</div>
      <div class="result-status" id="attendanceStatus">Enter your class details above.</div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-container">
    <p>&copy; 2026 Easy Grader. All rights reserved.</p>
    <div>
      <a href="https://quickpercent.github.io/">Easy Grader</a>
      <a href="https://quickpercent.github.io/attendance-calculator/">Attendance Calculator</a>
    </div>
  </div>
</footer>

<script>
function calculateAttendance(){
  const present = parseFloat(document.getElementById("presentClasses").value);
  const total = parseFloat(document.getElementById("totalClasses").value);
  const target = parseFloat(document.getElementById("targetPercent").value);

  if(isNaN(present) || isNaN(total) || total <= 0 || present < 0 || present > total){
    document.getElementById("attendancePercent").textContent = "0%";
    document.getElementById("attendanceStatus").textContent = "Please enter valid number of classes.";
    return;
  }

  const currentPercent = (present / total) * 100;
  document.getElementById("attendancePercent").textContent = currentPercent.toFixed(2) + "%";

  const statusEl = document.getElementById("attendanceStatus");

  if(currentPercent >= target){
    // Student can afford to miss some classes
    let maxAbsents = 0;
    while(((present) / (total + maxAbsents + 1)) * 100 >= target){
      maxAbsents++;
    }
    if(maxAbsents > 0){
      statusEl.textContent = `Great! You can safely miss (bunk) next ${maxAbsents} class(es) and still keep ${target}% attendance.`;
      statusEl.style.color = "#16a34a";
    } else {
      statusEl.textContent = `You are exactly at target! Do not miss the next class to stay above ${target}%.`;
      statusEl.style.color = "#d97706";
    }
  } else {
    // Student needs to attend more classes
    let neededClasses = 0;
    while(((present + neededClasses) / (total + neededClasses)) * 100 < target){
      neededClasses++;
    }
    statusEl.textContent = `Warning: You need to attend next ${neededClasses} class(es) continuously to reach ${target}% attendance.`;
    statusEl.style.color = "#dc2626";
  }
}
</script>
</body>
</html>
